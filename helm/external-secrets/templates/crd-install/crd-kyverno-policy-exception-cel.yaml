{{- if .Values.kyvernoPolicyExceptions.enabled }}
apiVersion: policies.kyverno.io/v1
kind: PolicyException
metadata:
  name: {{ include "external-secrets.name" . }}-crd
  namespace: "{{ .Values.giantswarm.policyExceptionNamespace | default .Release.Namespace }}"
  annotations:
    # create hook dependencies in the right order: lower than every crd-install
    # hook (the lowest is -7), so the exception exists before the crd-install
    # ServiceAccount (-4) and Job (-1) are created.
    "helm.sh/hook-weight": "-8"
    {{- include "crdInstallAnnotations" . | nindent 4 }}
  labels:
    {{- include "external-secrets.labels" . | nindent 4 }}
spec:
  policyRefs:
  - name: disallow-host-path
    kind: ValidatingPolicy
  - name: require-run-as-nonroot
    kind: ValidatingPolicy
  - name: restrict-volume-types
    kind: ValidatingPolicy
  - name: disallow-capabilities-strict
    kind: ValidatingPolicy
  - name: restrict-seccomp-strict
    kind: ValidatingPolicy
  - name: disallow-privilege-escalation
    kind: ValidatingPolicy
  # require-pod-probes is a supplemental policy and usually not enabled. It is
  # excepted because the external-secrets-crd-install Job Pods fail it when the
  # policy is enforced.
  - name: require-pod-probes
    kind: ValidatingPolicy
  # restrict-sa-automount-sa-token is a supplemental policy and usually not
  # enabled. It is excepted because the external-secrets-crd-install
  # ServiceAccount fails it when the policy is enforced.
  - name: restrict-sa-automount-sa-token
    kind: ValidatingPolicy
  matchConditions:
  - name: external-secrets-crd-install
    # ServiceAccount is matched for restrict-sa-automount-sa-token.
    expression: >-
      request.kind.kind in ['Job', 'Pod', 'ServiceAccount'] &&
      request.namespace == '{{ .Release.Namespace }}' &&
      has(object.metadata.name) &&
      (object.metadata.name == 'external-secrets' || object.metadata.name.startsWith('external-secrets-'))
{{- end }}
